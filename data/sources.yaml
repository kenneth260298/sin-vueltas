  # Licencias: Educación Vial (MOPT) evalúa, COSEVI administra y el BCR imprime.
  # Las URLs del BCR apuntan a la misma página con un ancla (#seccion) para que la cita
  # lleve directo a la sección. El crawler quita el ancla y descarga la página una sola vez.
  - id: licencia-primera-vez
    name: Licencia de conducir por primera vez
    group: documentos
    institution: Dirección General de Educación Vial (MOPT) y Banco de Costa Rica (BCR)
    varies_by_profile: false
    sources:
      - url: https://educacionvial.go.cr/procedimientos-y-requisitos/practicos/requisitos-practicos/
        format: html
        status: ok
        note: Requisitos de la prueba práctica por tipo de licencia
      - url: "https://bcrcita.bancobcr.com/citas/Home/Licencia#primeraVez"
        format: html
        status: ok
        note: Requisitos para imprimir la licencia en el BCR después de aprobar la práctica
      - url: https://bcrcita.bancobcr.com/citas/
        format: online_service
        status: ok
        note: Sistema de citas del BCR; se cita, no se rastrea
      - url: https://educacionvial.go.cr
        format: html
        status: review
        note: Buscar la página de credenciales y curso/prueba teórica (pasos previos a la práctica)

  - id: licencia-renovacion
    name: Renovación de licencia de conducir
    group: documentos
    institution: Banco de Costa Rica (BCR) y COSEVI
    varies_by_profile: false
