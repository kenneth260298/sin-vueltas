# Official sources for the procedures covered by Sin Vueltas.
#
# Each procedure lists the pages and PDFs the crawler downloads and the agent cites.
# status:
#   ok      -> the URL points to the requirements themselves
#   review  -> the URL is a portal or home page; find the specific page before ingesting
# varies_by_profile: true when requirements differ for salaried, self-employed or retired people.
#
# Bank pages are included only as examples of published requirements.
# The assistant never recommends a bank or a product.

version: 1
last_reviewed: 2026-11-06

procedures:
  # --- Documentos ---------------------------------------------------------------
  - id: cedula-primera-vez
    name: Cédula de identidad por primera vez
    group: documentos
    institution: Tribunal Supremo de Elecciones (TSE)
    varies_by_profile: false
    sources:
      - url: https://www.tse.go.cr/pdf/requisitosytramites/Solicitud-de-cedula-de-identidad-por-primera-vez.pdf
