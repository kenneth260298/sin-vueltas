        note: Incluye a quien quiere cambiarla con más de 3 meses de vigencia (en ese caso no puede renovar)
      - url: https://bcrcita.bancobcr.com/citas/
        format: online_service
        status: ok
        note: Sistema de citas del BCR; se cita, no se rastrea

